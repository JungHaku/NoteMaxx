  <body>
    <div id="root"></div>
    <script>
      // Installable + offline when hosted over http(s). Skipped inside the
      // macOS app, which runs on the notemaxx:// scheme where service workers
      // are unavailable (and unnecessary — its assets are already local).
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
